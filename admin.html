<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#750014"><title>Tournament Admin · Hereford Cup</title><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="admin.css"></head><body class="portal-body"><div class="top-rule"></div><header class="site-header portal-header"><a class="brand" href="index.html"><span class="brand-mark">HC</span><span><strong>HEREFORD CUP</strong><small>Tournament Admin</small></span></a><a class="text-button" href="portal.html">Player portal</a></header><main class="portal-main"><section class="admin-panel"><div class="dashboard-head"><div><p class="eyebrow">COURSE MANAGEMENT</p><h1>Add a course and tee</h1></div></div><form id="courseForm"><div class="admin-fields"><label>Course name<input name="courseName" required placeholder="Example Golf Club"></label><label>Location<input name="location" placeholder="City, State"></label><label>Tee name<input name="teeName" required placeholder="Blue"></label><label>Course rating<input name="rating" required type="number" step="0.1" min="50" max="90"></label><label>Slope<input name="slope" required type="number" min="55" max="155"></label><label>Total par<input name="par" required type="number" min="54" max="90" value="72"></label><label>Total yardage<input name="yardage" type="number" min="3000" max="9000"></label></div><div class="panel-heading admin-holes-heading"><span>18</span><div><small>TEE DETAILS</small><h2>Hole information</h2></div></div><div class="admin-hole-grid" id="adminHoles"></div><div class="save-row"><span id="adminMessage"></span><button class="button button-primary" type="submit">Save course and tee</button></div></form></section></main><script type="module" src="src/admin.js"></script></body></html>
