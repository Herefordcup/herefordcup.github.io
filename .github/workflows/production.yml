name: Production deployment

on:
  push:
    branches: [main]

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install locked test dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Run the complete test suite
        run: npm test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require the exact production deployment configuration
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          HISTORY_READY: ${{ vars.SUPABASE_MIGRATION_HISTORY_READY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROJECT_REF" = "mqulycovrogurvmjcimt"
          test "$HISTORY_READY" = "true"
      - name: Install the reviewed Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 3.2.0
      - name: Preflight Edge Function access before database changes
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --remote="$PROJECT_REF" > /dev/null
      - name: Verify production history is a valid local prefix
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          history="$(supabase migration list --remote="$PROJECT_REF")"
          printf '%s\n' "$history"
          printf '%s\n' "$history" | node scripts/verify-migration-history.mjs prefix
      - name: Preview pending production migrations
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --remote="$PROJECT_REF" --dry-run
      - name: Apply all pending production migrations
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --remote="$PROJECT_REF" --yes
      - name: Verify every checked-out migration is recorded remotely
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          history="$(supabase migration list --remote="$PROJECT_REF")"
          printf '%s\n' "$history"
          printf '%s\n' "$history" | node scripts/verify-migration-history.mjs complete
      - name: Deploy the commentary Edge Function from the migrated release
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy generate-match-commentary --remote="$PROJECT_REF" --use-api --yes

  build:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the migrated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build the GitHub Pages site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Upload the built site
        uses: actions/upload-pages-artifact@5f327015a708106f6f1b7c9a633901af30fe80cb
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the exact migrated build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
