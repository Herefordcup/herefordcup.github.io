name: Disposable authenticated browser smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: hereford-disposable-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact test commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node dependencies
        run: npm ci
      - name: Install the reviewed Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 3.2.0
      - name: Prepare transaction-compatible disposable project
        run: |
          workdir="$RUNNER_TEMP/hereford-e2e"
          echo "E2E_WORKDIR=$workdir" >> "$GITHUB_ENV"
          node scripts/e2e/prepare-project.mjs "$workdir"
      - name: Start disposable local Supabase
        run: supabase start --workdir "$E2E_WORKDIR" --exclude studio,imgproxy,mailpit,postgres-meta,realtime,edge-runtime,logflare,vector,supavisor
      - name: Rebuild the disposable database from migrations
        run: supabase db reset --workdir "$E2E_WORKDIR" --no-seed
      - name: Export only disposable local connection values
        run: |
          supabase status --workdir "$E2E_WORKDIR" -o env > "$RUNNER_TEMP/supabase-status.env"
          set -a
          . "$RUNNER_TEMP/supabase-status.env"
          set +a
          publishable_key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          service_key="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test "$API_URL" = "http://127.0.0.1:54321"
          test -n "$publishable_key"
          test -n "$service_key"
          password="E2E-$(openssl rand -hex 18)"
          echo "::add-mask::$password"
          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "E2E_SERVICE_ROLE_KEY=$service_key"
            echo "E2E_USER_EMAIL=e2e-admin@local.test"
            echo "E2E_USER_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Seed the controlled disposable account
        run: node scripts/e2e/seed.mjs
      - name: Install the reviewed Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run authenticated player and administrator smoke tests
        run: npm run test:e2e
      - name: Verify exact completion rows and generated-archive protection
        run: node scripts/e2e/verify-completion.mjs
      - name: Upload credential-free failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: disposable-e2e-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable Supabase data
        if: always()
        run: supabase stop --workdir "$E2E_WORKDIR" --no-backup
