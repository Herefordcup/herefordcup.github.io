name: Production deployment

on:
  push:
    branches: [main]

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run the complete test suite
        run: npm test

  migrate:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the exact production deployment configuration
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          HISTORY_READY: ${{ vars.SUPABASE_MIGRATION_HISTORY_READY }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROJECT_REF" = "mqulycovrogurvmjcimt"
          test "$HISTORY_READY" = "true"
      - name: Install the reviewed Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.2.0
      - name: Verify production history is a valid local prefix
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          history="$(supabase migration list --remote="$PROJECT_REF")"
          printf '%s\n' "$history"
          printf '%s\n' "$history" | node scripts/verify-migration-history.mjs prefix
      - name: Preview pending production migrations
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote="$PROJECT_REF" --dry-run
      - name: Apply all pending production migrations
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote="$PROJECT_REF" --yes
      - name: Verify every checked-out migration is recorded remotely
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          history="$(supabase migration list --remote="$PROJECT_REF")"
          printf '%s\n' "$history"
          printf '%s\n' "$history" | node scripts/verify-migration-history.mjs complete

  build:
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the migrated release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build the GitHub Pages site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Upload the built site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the exact migrated build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
