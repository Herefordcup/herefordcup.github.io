name: Deployment credential readiness

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: deployment-readiness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install the reviewed Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 3.2.0
      - name: Check token lifetime and read permissions
        id: readiness
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
          TOKEN_EXPIRES_ON: ${{ vars.SUPABASE_ACCESS_TOKEN_EXPIRES_ON }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          test "$PROJECT_REF" = "mqulycovrogurvmjcimt" || exit 1

          needs_action=false
          details=""
          if ! printf '%s' "$TOKEN_EXPIRES_ON" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$'; then
            needs_action=true
            details="The production token expiration variable is missing or invalid."
          else
            expiry_epoch="$(date -u -d "$TOKEN_EXPIRES_ON" +%s 2>/dev/null)"
            now_epoch="$(date -u +%s)"
            if [ -z "$expiry_epoch" ]; then
              needs_action=true
              details="The production token expiration date cannot be parsed."
            else
              remaining_days=$(( (expiry_epoch - now_epoch) / 86400 ))
              if [ "$remaining_days" -le 30 ]; then
                needs_action=true
                details="The production Supabase token expires on $TOKEN_EXPIRES_ON ($remaining_days days remaining)."
              fi
            fi
          fi

          if ! supabase migration list --remote="$PROJECT_REF" > /dev/null 2>&1; then
            needs_action=true
            details="$details Database or migration read access failed."
          fi
          if ! supabase functions list --remote="$PROJECT_REF" > /dev/null 2>&1; then
            needs_action=true
            details="$details Edge Function read access failed."
          fi

          echo "needs_action=$needs_action" >> "$GITHUB_OUTPUT"
          echo "details=$details" >> "$GITHUB_OUTPUT"
      - name: Maintain the deployment-readiness issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_ACTION: ${{ steps.readiness.outputs.needs_action }}
          DETAILS: ${{ steps.readiness.outputs.details }}
          TOKEN_EXPIRES_ON: ${{ vars.SUPABASE_ACCESS_TOKEN_EXPIRES_ON }}
        run: |
          title="[deployment readiness] Supabase production credential"
          issue="$(gh issue list --search "\"$title\" in:title" --state all --limit 10 --json number,title,state --jq 'map(select(.title == "[deployment readiness] Supabase production credential")) | first | if . then "\(.number) \(.state)" else "" end')"
          issue_number="${issue%% *}"
          issue_state="${issue#* }"

          if [ "$NEEDS_ACTION" = "true" ]; then
            body="The automated deployment-readiness check needs attention. $DETAILS Rotate or repair the project-scoped token, update the protected SUPABASE_ACCESS_TOKEN secret, and set SUPABASE_ACCESS_TOKEN_EXPIRES_ON to the replacement token's date. Never paste the token into this issue. cc @pimentelaj"
            if [ -z "$issue" ]; then
              gh issue create --title "$title" --body "$body" --assignee pimentelaj
            elif [ "$issue_state" = "CLOSED" ]; then
              gh issue reopen "$issue_number"
              gh issue comment "$issue_number" --body "$body"
            fi
          elif [ -n "$issue" ] && [ "$issue_state" = "OPEN" ]; then
            gh issue comment "$issue_number" --body "The automated deployment-readiness check has recovered. The protected credential currently passes the non-mutating lifetime, migration-read, and Edge-Function-read checks."
            gh issue close "$issue_number" --reason completed
          fi
