<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../portal.css">
  <link rel="stylesheet" href="../../admin.css">
  <title>Active Members roster QA</title>
</head>
<body class="portal-body">
  <main class="portal-main admin-main">
    <section class="admin-panel" id="membershipManagement">
      <div class="membership-sections">
        <section class="active-member-section">
          <div class="active-member-toolbar">
            <div><h2>Active members</h2><p>18 members</p></div>
            <div class="active-member-filters" role="search">
              <label>Search members<input type="search" placeholder="Search by name"></label>
              <label>Team<select><option>All teams</option></select></label>
              <label>Role<select><option>All roles</option></select></label>
            </div>
          </div>
          <div class="approval-list active-member-list" id="activeMembers"></div>
        </section>
      </div>
    </section>
  </main>
  <pre id="qa-result"></pre>
  <script type="module">
    import { createMutationGate, moveFocusFromFilteredCard } from '../../src/admin-helpers.js';

    const roster = document.querySelector('#activeMembers');
    for (let index = 1; index <= 18; index += 1) {
      const card = document.createElement('article');
      card.className = 'membership-card';

      const name = document.createElement('strong');
      name.textContent = `Player ${String(index).padStart(2, '0')}`;
      const details = document.createElement('p');
      details.textContent = `player · ${index % 2 ? 'Blue' : 'White'}`;

      const role = document.createElement('div');
      role.className = 'membership-team';
      const roleLabel = document.createElement('label');
      roleLabel.textContent = 'Tournament role';
      const roleSelect = document.createElement('select');
      roleSelect.add(new Option('Player', 'player'));
      roleLabel.append(roleSelect);
      role.append(roleLabel);

      const team = document.createElement('div');
      team.className = 'membership-team';
      const teamLabel = document.createElement('label');
      teamLabel.textContent = 'Tournament team';
      const teamSelect = document.createElement('select');
      teamSelect.add(new Option('Blue', 'cardinal'));
      teamLabel.append(teamSelect);
      team.append(teamLabel);

      const actions = document.createElement('div');
      const handicapLabel = document.createElement('label');
      handicapLabel.className = 'membership-handicap';
      handicapLabel.textContent = 'Handicap index';
      const handicap = document.createElement('input');
      handicap.type = 'number';
      handicap.value = (index / 2).toFixed(1);
      handicapLabel.append(handicap);
      const save = document.createElement('button');
      save.className = 'button';
      save.textContent = 'Save handicap';
      const remove = document.createElement('button');
      remove.className = 'button';
      remove.textContent = 'Delete';
      actions.append(handicapLabel, save, remove);

      card.append(name, details, role, team, actions);
      roster.append(card);
    }

    const membershipManagement = document.querySelector('#membershipManagement');
    const activeMemberSearch = document.querySelector('input[type="search"]');
    const filteredCard = roster.firstElementChild;
    const teamSelect = filteredCard.querySelector('.membership-team select');
    const mutationGate = createMutationGate(membershipManagement);
    teamSelect.focus();
    mutationGate.begin();
    mutationGate.begin();
    filteredCard.hidden = true;
    mutationGate.whenIdle(() => moveFocusFromFilteredCard(filteredCard, activeMemberSearch));
    mutationGate.end();
    const focusMovedBeforeFinalRelease = document.activeElement === activeMemberSearch;
    mutationGate.end();
    const focusMovedAfterFinalRelease = document.activeElement === activeMemberSearch;

    const rosterStyle = getComputedStyle(roster);
    const filterStyle = getComputedStyle(document.querySelector('.active-member-filters'));
    document.querySelector('#qa-result').textContent = JSON.stringify({
      viewportWidth: innerWidth,
      rosterColumns: rosterStyle.gridTemplateColumns.trim().split(/\s+/).length,
      filterColumns: filterStyle.gridTemplateColumns.trim().split(/\s+/).length,
      toolbarDirection: getComputedStyle(document.querySelector('.active-member-toolbar')).flexDirection,
      maxHeight: rosterStyle.maxHeight,
      overflowY: rosterStyle.overflowY,
      horizontalOverflow: document.body.scrollWidth > innerWidth,
      cardCount: roster.children.length,
      focusMovedBeforeFinalRelease,
      focusMovedAfterFinalRelease,
    });
  </script>
</body>
</html>
